# yazi — default TUI file manager (mod+E). Defaults: https://yazi-rs.github.io/docs/configuration/yazi
# Images: kitty graphics protocol, also inside tmux (needs allow-passthrough in tmux.conf)

[mgr]
show_hidden    = false
sort_by        = "natural"
sort_dir_first = true
linemode       = "size"

[preview]
max_width  = 1200
max_height = 1800

[opener]
pdf = [
	{ run = 'zathura "$@"', orphan = true, desc = "zathura" },
	{ run = 'okular "$@"',  orphan = true, desc = "okular (annotate/forms/sign)" },
]

[open]
prepend_rules = [
	{ mime = "application/pdf", use = [ "pdf", "open" ] },
]

# 3D models: plugins/model.yazi (3MF slicer thumbnail, else f3d render)
[plugin]
prepend_preloaders = [
	{ url = "*.{3mf,3MF,step,STEP,stp,STP}", run = "model" },
]
prepend_previewers = [
	{ url = "*.{3mf,3MF,step,STEP,stp,STP}", run = "model" },
]
