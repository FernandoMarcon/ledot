# yazi — default TUI file manager (mod+E). Defaults: https://yazi-rs.github.io/docs/configuration/yazi
# Images: kitty graphics protocol, also inside tmux (needs allow-passthrough in tmux.conf)

[mgr]
show_hidden    = false
sort_by        = "mtime"
sort_reverse   = true
sort_dir_first = true
linemode       = "size"

[preview]
max_width  = 1200
max_height = 1800

[opener]
# %s = selected files, %s1 = first one ("$@" is not expanded by yazi 26)
pdf = [
	{ run = "zathura %s", orphan = true, desc = "zathura" },
	{ run = "okular %s",  orphan = true, desc = "okular (annotate/forms/sign)" },
]
vlc = [
	{ run = "vlc %s", orphan = true, desc = "VLC" },
]
slicer = [
	{ run = "elegoo-slicer %s", orphan = true, desc = "ElegooSlicer" },
]
cad = [
	{ run = "flatpak run org.freecad.FreeCAD %s", orphan = true, desc = "FreeCAD" },
]

[open]
prepend_rules = [
	{ mime = "application/pdf",        use = [ "pdf", "open", "reveal" ] },
	{ mime = "{audio,video}/*",        use = [ "play", "vlc", "reveal" ] },
	{ url = "*.{3mf,3MF}",             use = [ "slicer", "cad", "reveal" ] },
	{ url = "*.{step,STEP,stp,STP}",   use = [ "cad", "slicer", "reveal" ] },
	{ url = "*.{FCStd,fcstd,FCSTD}",   use = [ "cad", "reveal" ] },
]

# 3D models: plugins/model.yazi (3MF/FCStd embedded thumbnail, else f3d render)
[plugin]
prepend_preloaders = [
	{ url = "*.{3mf,3MF,step,STEP,stp,STP,FCStd,fcstd,FCSTD}", run = "model" },
]
prepend_previewers = [
	{ url = "*.{3mf,3MF,step,STEP,stp,STP,FCStd,fcstd,FCSTD}", run = "model" },
]
