# yazi — default TUI file manager (mod+E). Defaults: https://yazi-rs.github.io/docs/configuration/yazi
# Images: kitty graphics protocol, also inside tmux (needs allow-passthrough in tmux.conf)

[mgr]
show_hidden    = false
sort_by        = "natural"
sort_dir_first = true
linemode       = "size"

[preview]
max_width  = 1200
max_height = 1800
