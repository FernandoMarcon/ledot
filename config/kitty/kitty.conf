## kitty config — ported from config/alacritty/alacritty.toml
## Default terminal: kitty's graphics protocol lets ranger (via ueberzugpp)
## draw image previews inside the pane, even through tmux.
## (alacritty imports no colors/fonts, so its built-in defaults are replicated here)

## FONT -----------------------------------------------------------
font_family      monospace
font_size        11.25

## WINDOW ---------------------------------------------------------
remember_window_size  no
initial_window_width  95c
initial_window_height 24c
# alacritty padding is 15px; kitty uses pt (15px @ 96dpi)
window_padding_width  11.25
background_opacity    1.0

## SCROLLING ------------------------------------------------------
scrollback_lines        100000
wheel_scroll_multiplier 3.0

## BELL -----------------------------------------------------------
enable_audio_bell    no
visual_bell_duration 0

## SELECTION ------------------------------------------------------
copy_on_select clipboard

## CURSOR ---------------------------------------------------------
cursor_shape               block
cursor_blink_interval      0.75
cursor_stop_blinking_after 5.0

## MOUSE ----------------------------------------------------------
mouse_hide_wait 0

## GENERAL --------------------------------------------------------
confirm_os_window_close 0

## KEYS -----------------------------------------------------------
# alacritty: Ctrl+Shift+U opens URL hints
map ctrl+shift+u open_url_with_hints
# alacritty: Shift+Return sends ESC CR
map shift+enter send_text all \x1b\r

## COLORS (alacritty defaults) -----------------------------------
foreground #d8d8d8
background #181818
cursor     #d8d8d8
cursor_text_color background

color0  #181818
color1  #ac4242
color2  #90a959
color3  #f4bf75
color4  #6a9fb5
color5  #aa759f
color6  #75b5aa
color7  #d8d8d8

color8  #6b6b6b
color9  #c55555
color10 #aac474
color11 #feca88
color12 #82b8c8
color13 #c28cb8
color14 #93d3c3
color15 #f8f8f8
